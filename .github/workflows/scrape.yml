name: NorthScout scrape

# Streamlit Cloud's filesystem is ephemeral, so the app cannot durably store
# its own data. This Action does the scraping on a schedule and commits the
# result back to the repo, which IS durable. The app just reads the committed
# snapshot.

on:
  schedule:
    # 11:00 UTC = 6am CT, 21:00 UTC = 4pm CT.
    # Morning run has overnight news ready before show prep; afternoon run
    # catches same-day pressers, cuts and transactions.
    - cron: "0 11 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "agent.py"
      - "database.py"
      - "export_json.py"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write           # required so the job can commit the snapshot

concurrency:
  group: northscout-scrape
  cancel-in-progress: false # never interrupt a run mid-commit

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Non-fatal: reports which feeds are live so a quietly-dead source shows
      # up in the run log instead of silently narrowing the board.
      - name: Check source health
        continue-on-error: true
        run: python check_sources.py | tee source_health.txt

      - name: Run scrape and build snapshot
        run: python export_json.py

      - name: Commit snapshot
        run: |
          git config user.name  "northscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/northscout.json data/rosters.json
          if git diff --staged --quiet; then
            echo "No change in snapshot - nothing to commit"
          else
            git commit -m "data: snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Snapshot committed"
          fi

      - name: Job summary
        if: always()
        run: |
          python summarize_run.py >> "$GITHUB_STEP_SUMMARY"
          if [ -f source_health.txt ]; then
            {
              echo ""
              echo "<details><summary>Feed health</summary>"
              echo ""
              echo '```'
              cat source_health.txt
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
